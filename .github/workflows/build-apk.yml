name: Build Club Fabrika APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Club Fabrika v2
        run: |
          rm -rf ClubFabrikaBuild
          mkdir ClubFabrikaBuild
          unzip -q ClubFabrika_Optical_v2.zip -d ClubFabrikaBuild

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          gradle -p ClubFabrikaBuild :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClubFabrika-APK
          path: ClubFabrikaBuild/app/build/outputs/apk/debug/app-debug.apk
